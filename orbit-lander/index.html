<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Orbit Lander</title>
  <style>
    :root{color-scheme:dark}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#07162b;color:#f6f5dc;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}canvas{display:block;width:100%;height:100%;touch-action:none;outline:0}#hud{position:fixed;z-index:2;inset:0;pointer-events:none;padding:clamp(10px,2.2vw,24px);font-size:clamp(9px,1.45vw,14px);letter-spacing:.08em;text-shadow:0 2px 8px #000}.panel{display:inline-block;padding:10px 12px;border:1px solid rgba(201,240,75,.62);background:rgba(7,22,43,.72);box-shadow:0 0 28px rgba(66,217,232,.1);backdrop-filter:blur(6px)}#top{display:flex;justify-content:space-between;gap:12px}.accent{color:#c9f04b}.amber{color:#ffb323}.cyan{color:#42d9e8}.muted{color:#a8b7c5}#msg{position:absolute;left:50%;bottom:clamp(14px,4vw,42px);transform:translateX(-50%);max-width:min(88vw,680px);text-align:center;line-height:1.55;transition:opacity .35s}.danger{border-color:#ff6a5e;color:#ffe9d8}@media(max-width:600px){#hud{padding:9px}.panel{padding:7px 8px;font-size:9px}#top{gap:5px}}
  </style>
</head>
<body>
  <div id="hud"><div id="top"><div class="panel"><span class="accent">ORBIT LANDER</span><br><span class="muted" id="mission">MISSION 01 / 03</span></div><div class="panel" style="text-align:right"><span id="fuel">FUEL 100%</span><br><span class="muted" id="telemetry">VEL 000 · TILT 00°</span></div></div><div id="msg" class="panel"><span class="accent">SYSTEM READY</span><br>Rotate with ← → · hold ↑ / × for thrust · land slowly and level.</div></div>
  <canvas id="game" tabindex="0" aria-label="Orbit Lander game canvas"></canvas>
  <script>
  (()=>{
    const say=(state,message)=>{try{parent.postMessage({type:'retroplay-runtime-status',state,message},location.origin)}catch(_){}};
    const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
    const missionEl=document.getElementById('mission'),fuelEl=document.getElementById('fuel'),telemetryEl=document.getElementById('telemetry'),msg=document.getElementById('msg');
    const W=()=>innerWidth,H=()=>innerHeight;let dpr=1;
    const resize=()=>{dpr=Math.min(devicePixelRatio||1,2);canvas.width=W()*dpr;canvas.height=H()*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)};resize();addEventListener('resize',resize);
    const missions=[
      {name:'CALM ORBIT',gravity:25,wind:0,start:{x:.29,y:.18,angle:0},pads:[{x:.44,w:.22,kind:'safe'}],rocks:[.07,.18,.73,.89],stars:70},
      {name:'CROSSWIND',gravity:28,wind:17,start:{x:.69,y:.16,angle:-.18},pads:[{x:.17,w:.18,kind:'safe'},{x:.59,w:.13,kind:'safe'}],rocks:[.04,.33,.42,.77,.92],stars:92},
      {name:'TWIN BASIN',gravity:31,wind:-22,start:{x:.46,y:.12,angle:.13},pads:[{x:.11,w:.13,kind:'safe'},{x:.72,w:.16,kind:'safe'}],rocks:[.01,.25,.38,.54,.94],stars:108}
    ];
    const keys={},ship={x:0,y:0,vx:0,vy:0,a:0,va:0,fuel:100},particles=[];let mi=0,state='intro',elapsed=0,last=performance.now(),nextTimer=0,stars=[];
    const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
    const setMsg=(title,detail,keep=false,kind='')=>{msg.className='panel '+kind;msg.innerHTML=`<span class="accent">${title}</span><br>${detail}`;msg.style.opacity='1';clearTimeout(setMsg.timer);if(!keep)setMsg.timer=setTimeout(()=>msg.style.opacity='.2',3000)};
    const makeStars=()=>{let seed=mi*9521+117;const rnd=()=>((seed=(seed*9301+49297)%233280)/233280);stars=Array.from({length:missions[mi].stars},()=>({x:rnd(),y:rnd()*.75,r:rnd()*1.5+.4,p:rnd()*Math.PI*2}));};
    const reset=(announce=true)=>{const m=missions[mi];Object.assign(ship,{x:m.start.x*W(),y:m.start.y*H(),vx:0,vy:0,a:m.start.angle,va:0,fuel:100});particles.length=0;state='flying';elapsed=0;nextTimer=0;makeStars();missionEl.textContent=`MISSION ${String(mi+1).padStart(2,'0')} / 03 · ${m.name}`;fuelEl.textContent='FUEL 100%';telemetryEl.textContent='VEL 000 · TILT 00°';if(announce)setMsg(`MISSION ${String(mi+1).padStart(2,'0')}`,`${m.name} · touch down on an amber pad.`,true)};
    const load=(index)=>{mi=(index+missions.length)%missions.length;reset(true)};
    const terrainY=x=>{const m=missions[mi],base=H()*.82;let wave=Math.sin(x*.014+mi)*15+Math.sin(x*.042-mi)*8;for(const r of m.rocks){const rx=r*W(),dist=Math.abs(x-rx);if(dist<80)wave-=Math.cos(dist/80*Math.PI)*34}return base+wave};
    const pads=()=>missions[mi].pads.map(p=>({x:p.x*W(),w:p.w*W(),y:terrainY(p.x*W())}));
    const thrusting=()=>state==='flying'&&(keys.ArrowUp||keys[' ']||keys.Enter)&&ship.fuel>0;
    const explode=(good=false)=>{state=good?'landed':'crashed';for(let i=0;i<(good?26:64);i++){const ang=Math.random()*Math.PI*2,sp=(good?30:55)+Math.random()*(good?75:180);particles.push({x:ship.x,y:ship.y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:good?.8:1.15,c:good?(i%2?'#c9f04b':'#ffb323'):(i%3?'#ff6a5e':'#ffb323')})}if(good){setMsg('SOFT LANDING',`Fuel ${Math.round(ship.fuel)}% · Mission complete.`,true);nextTimer=performance.now()+1850}else setMsg('HULL LOST','Reduce vertical speed and keep the landing gear level. × / ENTER to retry.',true,'danger')};
    const keyDown=e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Enter',' ','KeyN','KeyR','Escape'].includes(e.code)||['ArrowLeft','ArrowRight','ArrowUp','Enter',' ','n','N','r','R','Escape'].includes(e.key))e.preventDefault();const k=e.code==='Space'?' ':e.key;keys[k]=true;if(e.key==='Enter'&&(state==='crashed'||state==='intro'))reset(true);if(e.key==='Escape'||e.key==='r'||e.key==='R')reset(true);if(e.key==='n'||e.key==='N')load(mi+1)};
    const keyUp=e=>{const k=e.code==='Space'?' ':e.key;keys[k]=false};document.addEventListener('keydown',keyDown);document.addEventListener('keyup',keyUp);
    canvas.addEventListener('pointerdown',e=>{canvas.focus();if(e.pointerType==='mouse')keyDown({key:' ',code:'Space',preventDefault(){}})});canvas.addEventListener('pointerup',e=>{if(e.pointerType==='mouse')keyUp({key:' ',code:'Space'})});
    const update=(dt)=>{elapsed+=dt;for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=80*dt}for(let i=particles.length-1;i>=0;i--)if(particles[i].life<=0)particles.splice(i,1);if(nextTimer&&performance.now()>nextTimer){load(mi+1);return}if(state!=='flying')return;const m=missions[mi];if(keys.ArrowLeft)ship.va-=3.25*dt;if(keys.ArrowRight)ship.va+=3.25*dt;ship.va*=Math.pow(.035,dt);ship.a+=ship.va*dt;ship.a=clamp(ship.a,-1.5,1.5);ship.vy+=m.gravity*dt;ship.vx+=m.wind*dt;const active=thrusting();if(active){ship.fuel=Math.max(0,ship.fuel-dt*17);const fx=Math.sin(ship.a)*128,fy=-Math.cos(ship.a)*128;ship.vx+=fx*dt;ship.vy+=fy*dt;for(let i=0;i<3;i++)particles.push({x:ship.x+Math.sin(ship.a)*2+(Math.random()-.5)*7,y:ship.y+20,vx:-fx*.16+(Math.random()-.5)*20,vy:70+(Math.random()*35),life:.28,c:i?'#ffb323':'#f6f5dc'})}ship.vx*=Math.pow(.88,dt);ship.x+=ship.vx*dt;ship.y+=ship.vy*dt;const margin=17;if(ship.x<margin){ship.x=margin;ship.vx=Math.abs(ship.vx)*.36}if(ship.x>W()-margin){ship.x=W()-margin;ship.vx=-Math.abs(ship.vx)*.36}const floor=terrainY(ship.x);if(ship.y+19>=floor){const isPad=pads().some(p=>Math.abs(ship.x-p.x)<p.w/2-12);const soft=Math.abs(ship.vy)<72&&Math.abs(ship.vx)<50&&Math.abs(ship.a)<.28;if(isPad&&soft){ship.y=floor-19;ship.vx=ship.vy=0;explode(true)}else explode(false)}const speed=Math.hypot(ship.vx,ship.vy);fuelEl.textContent=`FUEL ${String(Math.round(ship.fuel)).padStart(3,'0')}%`;telemetryEl.textContent=`VEL ${String(Math.round(speed)).padStart(3,'0')} · TILT ${String(Math.round(Math.abs(ship.a)*180/Math.PI)).padStart(2,'0')}°`};
    const line=(x1,y1,x2,y2,c,w=1)=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=c;ctx.lineWidth=w;ctx.stroke()};
    const drawShip=()=>{ctx.save();ctx.translate(ship.x,ship.y);ctx.rotate(ship.a);ctx.strokeStyle='#f6f5dc';ctx.fillStyle='#0e2744';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(13,14);ctx.lineTo(7,18);ctx.lineTo(-7,18);ctx.lineTo(-13,14);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#42d9e8';ctx.beginPath();ctx.moveTo(-5,-5);ctx.lineTo(5,-5);ctx.lineTo(7,5);ctx.lineTo(-7,5);ctx.closePath();ctx.fill();line(-10,14,-20,25,'#f6f5dc',2);line(10,14,20,25,'#f6f5dc',2);line(-23,25,-15,25,'#f6f5dc',2);line(15,25,23,25,'#f6f5dc',2);if(thrusting()){ctx.fillStyle='#ffb323';ctx.beginPath();ctx.moveTo(-5,18);ctx.lineTo(0,35+Math.random()*7);ctx.lineTo(5,18);ctx.fill();ctx.fillStyle='#f6f5dc';ctx.fillRect(-1.5,19,3,10)}ctx.restore()};
    const draw=()=>{ctx.fillStyle='#07162b';ctx.fillRect(0,0,W(),H());const planetX=W()*.74,planetY=H()*.73,r=Math.min(W(),H())*.29;ctx.fillStyle='#263e66';ctx.beginPath();ctx.arc(planetX,planetY,r,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(201,240,75,.86)';ctx.beginPath();ctx.arc(planetX,planetY+12,r*.78,Math.PI,Math.PI*2);ctx.fill();for(const s of stars){ctx.globalAlpha=.35+.55*(.5+.5*Math.sin(elapsed*1.8+s.p));ctx.fillStyle=s.x>.67?'#c9f04b':'#42d9e8';ctx.fillRect(s.x*W(),s.y*H(),s.r,s.r)}ctx.globalAlpha=1;for(let i=0;i<4;i++){const x=(i+.6)/4*W();line(x,0,x+W()*.10,H()*.16,'rgba(66,217,232,.13)',1)}ctx.fillStyle='#0b2543';ctx.beginPath();ctx.moveTo(0,H());for(let x=0;x<=W()+12;x+=12)ctx.lineTo(x,terrainY(x));ctx.lineTo(W(),H());ctx.closePath();ctx.fill();ctx.strokeStyle='#42d9e8';ctx.lineWidth=1.5;ctx.beginPath();for(let x=0;x<=W()+12;x+=12){if(x===0)ctx.moveTo(x,terrainY(x));else ctx.lineTo(x,terrainY(x))}ctx.stroke();for(const p of pads()){ctx.fillStyle='#ffb323';ctx.fillRect(p.x-p.w/2,p.y-5,p.w,5);ctx.strokeStyle='#f6f5dc';ctx.lineWidth=1;ctx.strokeRect(p.x-p.w/2,p.y-5,p.w,5);line(p.x-p.w*.34,p.y-5,p.x-p.w*.34,p.y-18,'#ffb323',2);line(p.x+p.w*.34,p.y-5,p.x+p.w*.34,p.y-18,'#ffb323',2)}for(const p of particles){ctx.globalAlpha=clamp(p.life*2.6,0,1);ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,4,4)}ctx.globalAlpha=1;drawShip();if(state==='intro'){ctx.fillStyle='rgba(7,22,43,.56)';ctx.fillRect(0,0,W(),H())}};
    const loop=now=>{const dt=Math.min((now-last)/1000,.04);last=now;update(dt);draw();requestAnimationFrame(loop)};reset(false);setMsg('SYSTEM READY','Rotate with ← → · hold ↑ / × for thrust · land slowly and level.',true);say('ready','READY\nOrbit Lander is running locally. Use keyboard, PSP touch controls or a gamepad.');requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
