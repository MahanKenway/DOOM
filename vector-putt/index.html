<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Vector Putt 3D</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#071418;color:#ebffe7;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}canvas{display:block;width:100%;height:100%;outline:0;touch-action:none}#hud{position:fixed;inset:0;z-index:2;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;padding:clamp(10px,2.2vw,24px);font-size:clamp(9px,1.45vw,14px);letter-spacing:.08em;text-shadow:0 2px 7px #000}.panel{padding:11px 13px;border:1px solid rgba(210,255,87,.65);background:rgba(7,20,24,.62);box-shadow:0 0 24px rgba(107,255,123,.12);backdrop-filter:blur(6px)}.accent{color:#d8ff57}.muted{color:#9cb9a5}#message{position:absolute;right:50%;bottom:clamp(14px,4vw,45px);transform:translateX(50%);width:min(88vw,580px);text-align:center;line-height:1.55;transition:opacity .3s}.error{border-color:#ff9b6a;color:#ffe8d8}@media(max-width:520px){#hud{padding:9px}.panel{padding:8px 9px;font-size:9px}#message{bottom:12px;font-size:9px}}
  </style>
</head>
<body>
  <div id="hud"><div class="panel"><span class="accent">VECTOR PUTT 3D</span><br><span class="muted" id="hole">HOLE 01 / 03</span></div><div class="panel" style="text-align:right"><span id="strokes">STROKES 00</span><br><span class="muted" id="par">PAR 03</span></div><div id="message" class="panel"><span class="accent">READY</span><br>Aim with ← → · set power with ↑ ↓ · hold × / ENTER then release to shoot.</div></div>
  <script src="../hexgl/libs/Three.r53.js"></script>
  <script>
  (() => {
    const say = (state, message) => { try { parent.postMessage({type:'retroplay-runtime-status',state,message},location.origin); } catch (_) {} };
    const message = document.getElementById('message'), holeText=document.getElementById('hole'), strokesText=document.getElementById('strokes'), parText=document.getElementById('par');
    const setMessage=(title,detail,keep=false)=>{message.innerHTML=`<span class="accent">${title}</span><br>${detail}`;message.style.opacity='1';if(!keep) clearTimeout(setMessage.timer),setMessage.timer=setTimeout(()=>message.style.opacity='.16',3100)};
    const startFallback = () => {
      const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.id='canvas';canvas.tabIndex=0;document.body.appendChild(canvas);
      const holes=[
        {name:'MOSS GATE',par:3,start:[0,7.4],cup:[0,-7.5],slope:[.04,0],blocks:[[-2.6,-1.8,1.25,3.2],[2.4,-5.1,1.15,2.8]],hazards:[[0,-3.7,2.1,1.1]]},
        {name:'PINBALL CUT',par:4,start:[-3.7,7.1],cup:[3.9,-7.2],slope:[-.02,.035],blocks:[[-1.9,3.3,1,5.4],[1.2,1.4,1,4.2],[3.5,-3.5,3.2,1.05]],hazards:[[-2.4,-4.7,2.7,1.2]]},
        {name:'SPLIT LANE',par:5,start:[0,7.1],cup:[0,-7.7],slope:[.025,-.025],blocks:[[0,2.6,1.05,8.2],[-3.2,-3.3,3.2,1],[3.2,-5.8,3.2,1]],hazards:[[0,-5.2,1.15,2.5]]}
      ];
      let hi=0,ball={x:0,z:0,vx:0,vz:0},aim=-Math.PI/2,power=.47,charge=false,strokes=0,won=false;const keys={};
      const resize=()=>{canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)};resize();addEventListener('resize',resize);
      const hole=()=>holes[hi], px=x=>innerWidth/2+x*Math.min(innerWidth/14,innerHeight/23), py=z=>innerHeight/2+z*Math.min(innerWidth/14,innerHeight/23);
      const reset=(penalty=false)=>{ball.x=hole().start[0];ball.z=hole().start[1];ball.vx=ball.vz=0;if(penalty)strokes++;strokesText.textContent=`STROKES ${String(strokes).padStart(2,'0')}`};
      const load=i=>{hi=i%holes.length;strokes=0;won=false;aim=-Math.PI/2;power=.47;reset();holeText.textContent=`HOLE ${String(hi+1).padStart(2,'0')} / 03 · ${hole().name}`;parText.textContent=`PAR ${String(hole().par).padStart(2,'0')}`;strokesText.textContent='STROKES 00';setMessage(`HOLE ${String(hi+1).padStart(2,'0')}`,`${hole().name} · compatibility physics view`,true)};

      const onDown=e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter',' ','Escape','n','N','r','R'].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key==='Enter'||e.key===' '){if(!charge&&Math.hypot(ball.vx,ball.vz)<.035&&!won){charge=true;setMessage('POWER SET',`Release × / ENTER to strike · ${Math.round(power*100)}%`,true)}}if(e.key==='Escape')load(hi);if(e.key==='n'||e.key==='N')load(hi+1);if(e.key==='r'||e.key==='R')reset()};
      const onUp=e=>{keys[e.key]=false;if((e.key==='Enter'||e.key===' ')&&charge)strike()};document.addEventListener('keydown',onDown);document.addEventListener('keyup',onUp);canvas.addEventListener('pointerdown',e=>{canvas.focus();if(e.pointerType==='mouse')onDown({key:'Enter',preventDefault(){}})});canvas.addEventListener('pointerup',e=>{if(e.pointerType==='mouse')onUp({key:'Enter'})});
      const update=dt=>{if(!won&&Math.hypot(ball.vx,ball.vz)<.035){if(keys.ArrowLeft)aim+=1.9*dt;if(keys.ArrowRight)aim-=1.9*dt;if(keys.ArrowUp)power=Math.min(1,power+dt*.54);if(keys.ArrowDown)power=Math.max(.05,power-dt*.54)}if(Math.hypot(ball.vx,ball.vz)>.0001){ball.vx+=hole().slope[0]*dt;ball.vz+=hole().slope[1]*dt;const f=Math.pow(.33,dt);ball.vx*=f;ball.vz*=f;ball.x+=ball.vx*dt;ball.z+=ball.vz*dt;if(ball.x<-5.62||ball.x>5.62){ball.x=Math.max(-5.62,Math.min(5.62,ball.x));ball.vx*=-.72}if(ball.z<-9.62||ball.z>9.62){ball.z=Math.max(-9.62,Math.min(9.62,ball.z));ball.vz*=-.72}for(const b of hole().blocks){const dx=ball.x-b[0],dz=ball.z-b[1],px=b[2]/2+.38-Math.abs(dx),pz=b[3]/2+.38-Math.abs(dz);if(px>0&&pz>0){if(px<pz){ball.x+=dx<0?-px:px;ball.vx*=-.72}else{ball.z+=dz<0?-pz:pz;ball.vz*=-.72}}}for(const h of hole().hazards)if(Math.abs(ball.x-h[0])<h[2]/2&&Math.abs(ball.z-h[1])<h[3]/2){reset(true);setMessage('WATER HAZARD','Ball reset · one stroke penalty.',true);break}if(Math.hypot(ball.vx,ball.vz)<.025)ball.vx=ball.vz=0}if(!won&&Math.hypot(ball.x-hole().cup[0],ball.z-hole().cup[1])<.5&&Math.hypot(ball.vx,ball.vz)<1.4){won=true;ball.vx=ball.vz=0;setMessage('HOLE COMPLETE',`Finished in ${strokes} strokes. Loading next course…`,true);setTimeout(()=>load(hi+1),1600)}};
      const draw=()=>{ctx.clearRect(0,0,innerWidth,innerHeight);ctx.fillStyle='#071418';ctx.fillRect(0,0,innerWidth,innerHeight);ctx.fillStyle='#2f8d68';ctx.fillRect(px(-6),py(-10),px(6)-px(-6),py(10)-py(-10));ctx.strokeStyle='#53ad7f';ctx.lineWidth=1;for(let i=-5;i<=5;i++){ctx.beginPath();ctx.moveTo(px(i),py(-10));ctx.lineTo(px(i),py(10));ctx.stroke()}for(let i=-9;i<=9;i+=2){ctx.beginPath();ctx.moveTo(px(-6),py(i));ctx.lineTo(px(6),py(i));ctx.stroke()}ctx.fillStyle='#195060';for(const b of hole().blocks)ctx.fillRect(px(b[0]-b[2]/2),py(b[1]-b[3]/2),px(b[2])-px(0),py(b[3])-py(0));ctx.fillStyle='rgba(154,63,83,.8)';for(const h of hole().hazards)ctx.fillRect(px(h[0]-h[2]/2),py(h[1]-h[3]/2),px(h[2])-px(0),py(h[3])-py(0));ctx.beginPath();ctx.fillStyle='#071418';ctx.arc(px(hole().cup[0]),py(hole().cup[1]),Math.min(innerWidth/14,innerHeight/23)*.5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ff5ba6';ctx.beginPath();ctx.moveTo(px(hole().cup[0]),py(hole().cup[1]));ctx.lineTo(px(hole().cup[0]),py(hole().cup[1])-50);ctx.stroke();ctx.fillStyle='#ff5ba6';ctx.fillRect(px(hole().cup[0]),py(hole().cup[1])-50,27,17);if(!won&&Math.hypot(ball.vx,ball.vz)<.035){ctx.strokeStyle=charge?'#ffdb50':'#eaff68';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(px(ball.x),py(ball.z));ctx.lineTo(px(ball.x+Math.cos(aim)*(1+power*2)),py(ball.z+Math.sin(aim)*(1+power*2)));ctx.stroke()}ctx.beginPath();ctx.fillStyle='#f2ffe9';ctx.arc(px(ball.x),py(ball.z),Math.max(7,Math.min(innerWidth/14,innerHeight/23)*.38),0,Math.PI*2);ctx.fill();ctx.strokeStyle='#b8ff54';ctx.stroke()};
      let last=performance.now();const loop=now=>{const dt=Math.min((now-last)/1000,.04);last=now;update(dt);draw();requestAnimationFrame(loop)};load(0);setMessage('COMPATIBILITY READY','Your device is using the playable Canvas physics view. Arrow keys and PSP controls work normally.',true);say('ready','READY\nVector Putt 3D compatibility physics view is running locally.');requestAnimationFrame(loop);
    };
    if (!window.THREE || !THREE.WebGLRenderer) { startFallback(); return; }
    let renderer;
    try { renderer=new THREE.WebGLRenderer({antialias:true,alpha:false}); } catch (_) { startFallback(); return; }
    renderer.setClearColor(0x071418,1); renderer.setSize(innerWidth,innerHeight); renderer.shadowMapEnabled=true; renderer.shadowMapSoft=true; renderer.domElement.id='canvas'; renderer.domElement.tabIndex=0; document.body.appendChild(renderer.domElement);
    const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(47,innerWidth/innerHeight,.1,100); camera.position.set(0,13,15); camera.lookAt(new THREE.Vector3(0,0,-1));
    const ambient=new THREE.AmbientLight(0x668899,.63);scene.add(ambient);const key=new THREE.DirectionalLight(0xe9ffd3,1.0);key.position.set(7,12,8);key.castShadow=true;scene.add(key);const rim=new THREE.PointLight(0x75fff1,1.2,34);rim.position.set(-7,5,-7);scene.add(rim);
    const world=new THREE.Group();scene.add(world);const ballGroup=new THREE.Group();world.add(ballGroup);const ball=new THREE.Mesh(new THREE.SphereGeometry(.38,22,16),new THREE.MeshPhongMaterial({color:0xf2ffe9,shininess:100}));ball.castShadow=true;ballGroup.add(ball);const ballRing=new THREE.Mesh(new THREE.TorusGeometry(.46,.035,8,28),new THREE.MeshBasicMaterial({color:0xb8ff54,transparent:true,opacity:.72}));ballRing.rotation.x=Math.PI/2;ballRing.position.y=.032;ballGroup.add(ballRing);
    const directionArrow=new THREE.ArrowHelper(new THREE.Vector3(0,0,-1),new THREE.Vector3(),1.2,0xeaff68,.28,.17);world.add(directionArrow);const trail=[];const material={green:new THREE.MeshPhongMaterial({color:0x2f8d68,shininess:35}),edge:new THREE.MeshPhongMaterial({color:0x0f2f36,shininess:12}),wall:new THREE.MeshPhongMaterial({color:0x195060,shininess:48}),hazard:new THREE.MeshBasicMaterial({color:0x9a3f53,transparent:true,opacity:.78}),cup:new THREE.MeshBasicMaterial({color:0x071418}),flag:new THREE.MeshBasicMaterial({color:0xff5ba6})};
    const levels=[
      {name:'MOSS GATE',par:3,start:[0,0,7.4],cup:[0,0,-7.5],slope:[.04,0],walls:[[0,-.4,0,12,.7],[0,-.4,-10,12,.7],[-6,-.4,0,.7,20],[6,-.4,0,.7,20]],blocks:[[-2.6,-1.8,1.25,3.2],[2.4,-5.1,1.15,2.8]],hazards:[[0,-3.7,2.1,1.1]]},
      {name:'PINBALL CUT',par:4,start:[-3.7,0,7.1],cup:[3.9,0,-7.2],slope:[-.02,.035],walls:[[0,-.4,0,12,.7],[0,-.4,-10,12,.7],[-6,-.4,0,.7,20],[6,-.4,0,.7,20]],blocks:[[-1.9,3.3,1,5.4],[1.2,1.4,1,4.2],[3.5,-3.5,3.2,1.05]],hazards:[[-2.4,-4.7,2.7,1.2]]},
      {name:'SPLIT LANE',par:5,start:[0,0,7.1],cup:[0,0,-7.7],slope:[.025,-.025],walls:[[0,-.4,0,12,.7],[0,-.4,-10,12,.7],[-6,-.4,0,.7,20],[6,-.4,0,.7,20]],blocks:[[0,2.6,1.05,8.2],[-3.2,-3.3,3.2,1],[3.2,-5.8,3.2,1]],hazards:[[0,-5.2,1.15,2.5]]}
    ];
    let levelIndex=0, stroke=0, aim=-Math.PI/2, power=.47, charge=false, velocity=new THREE.Vector3(), running=true, won=false, current;
    const colliders=[], hazards=[];const clearWorld=()=>{while(world.children.length>0)world.remove(world.children[0]);world.add(ballGroup);world.add(directionArrow);colliders.length=0;hazards.length=0;trail.splice(0).forEach(x=>world.remove(x));};
    const addBox=(x,z,w,d,mat,height=.72)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,height,d),mat);m.position.set(x,height/2,z);m.castShadow=true;m.receiveShadow=true;world.add(m);return m};
    const addCollider=(x,z,w,d)=>colliders.push({x,z,w,d});
    const loadLevel=(index,announce=true)=>{levelIndex=index%levels.length;current=levels[levelIndex];clearWorld();const floor=new THREE.Mesh(new THREE.PlaneGeometry(12,20,1,1),material.green);floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;floor.position.z=-.1;world.add(floor);const grid=new THREE.GridHelper(20,20,0x4ba47d,0x29715a);grid.position.y=.012;world.add(grid);current.walls.forEach(([x,y,z,w,d])=>{addBox(x,z,w,d,material.edge,.72);addCollider(x,z,w,d)});current.blocks.forEach(([x,z,w,d])=>{addBox(x,z,w,d,material.wall,.95);addCollider(x,z,w,d)});current.hazards.forEach(([x,z,w,d])=>{const h=addBox(x,z,w,d,material.hazard,.035);h.position.y=.02;hazards.push({x,z,w,d})});const cup=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,.04,28),material.cup);cup.position.set(current.cup[0],.025,current.cup[2]);world.add(cup);const pole=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,2.25,8),new THREE.MeshBasicMaterial({color:0xeaffd2}));pole.position.set(current.cup[0],1.12,current.cup[2]);world.add(pole);const flag=new THREE.Mesh(new THREE.PlaneGeometry(1.05,.58),material.flag);flag.position.set(current.cup[0]+.52,1.9,current.cup[2]);world.add(flag);ball.position.set(current.start[0],.4,current.start[2]);velocity.set(0,0,0);aim=-Math.PI/2;power=.47;charge=false;stroke=0;won=false;holeText.textContent=`HOLE ${String(levelIndex+1).padStart(2,'0')} / 03 · ${current.name}`;parText.textContent=`PAR ${String(current.par).padStart(2,'0')}`;strokesText.textContent='STROKES 00';if(announce)setMessage(`HOLE ${String(levelIndex+1).padStart(2,'0')}`,`${current.name} · Par ${current.par}`,true)};
    const resetBall=(penalty=false)=>{ball.position.set(current.start[0],.4,current.start[2]);velocity.set(0,0,0);if(penalty){stroke++;strokesText.textContent=`STROKES ${String(stroke).padStart(2,'0')}`;setMessage('WATER HAZARD','Ball reset · one stroke penalty.',true)}};
    const shoot=()=>{if(won||velocity.length()>0.035)return;const force=.7+power*4.2;velocity.set(Math.cos(aim)*force,0,Math.sin(aim)*force);stroke++;strokesText.textContent=`STROKES ${String(stroke).padStart(2,'0')}`;charge=false;setMessage('SHOT AWAY',`Stroke ${stroke} · read the slope.`,false)};
    const keyDown=e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter',' ','Escape','n','N','r','R'].includes(e.key))e.preventDefault();if(e.key==='Enter'||e.key===' '){if(!charge&&velocity.length()<.035&&!won){charge=true;setMessage('POWER SET',`Release × / ENTER to strike · ${Math.round(power*100)}%`,true)}}if(e.key==='Escape')loadLevel(levelIndex,true);if(e.key==='n'||e.key==='N')loadLevel(levelIndex+1,true);if(e.key==='r'||e.key==='R')resetBall(false)};
    const keyUp=e=>{if(e.key==='Enter'||e.key===' '){if(charge)shoot()}};document.addEventListener('keydown',keyDown);document.addEventListener('keyup',keyUp);renderer.domElement.addEventListener('pointerdown',e=>{renderer.domElement.focus();if(e.pointerType==='mouse')keyDown({key:'Enter',preventDefault(){}})});renderer.domElement.addEventListener('pointerup',e=>{if(e.pointerType==='mouse')keyUp({key:'Enter'})});
    const intersects=(p,c)=>Math.abs(p.x-c.x)<c.w/2+.38&&Math.abs(p.z-c.z)<c.d/2+.38;
    const updatePhysics=dt=>{if(velocity.length()>.0001){velocity.x+=current.slope[0]*dt;velocity.z+=current.slope[1]*dt;velocity.multiplyScalar(Math.pow(.33,dt));ball.position.addScaledVector(velocity,dt);ball.rotation.z-=velocity.x*dt/.38;ball.rotation.x+=velocity.z*dt/.38;for(const c of colliders){if(!intersects(ball.position,c))continue;const dx=ball.position.x-c.x,dz=ball.position.z-c.z;const px=c.w/2+.38-Math.abs(dx),pz=c.d/2+.38-Math.abs(dz);if(px<pz){ball.position.x+=dx<0?-px:px;velocity.x*=-.72}else{ball.position.z+=dz<0?-pz:pz;velocity.z*=-.72}}for(const h of hazards){if(Math.abs(ball.position.x-h.x)<h.w/2&&Math.abs(ball.position.z-h.z)<h.d/2){resetBall(true);break}}if(velocity.length()<.025)velocity.set(0,0,0)}const cup=new THREE.Vector3(current.cup[0],.4,current.cup[2]);if(!won&&ball.position.distanceTo(cup)<.52&&velocity.length()<1.4){won=true;velocity.set(0,0,0);setMessage('HOLE COMPLETE',`Finished in ${stroke} strokes. Loading next course…`,true);setTimeout(()=>loadLevel(levelIndex+1,true),1600)}};
    const keys={};document.addEventListener('keydown',e=>{keys[e.key]=true});document.addEventListener('keyup',e=>{keys[e.key]=false});
    const clock=new THREE.Clock();const animate=()=>{if(!running)return;requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);if(!won&&velocity.length()<.035){if(keys.ArrowLeft)aim+=1.9*dt;if(keys.ArrowRight)aim-=1.9*dt;if(keys.ArrowUp)power=Math.min(1,power+dt*.54);if(keys.ArrowDown)power=Math.max(.05,power-dt*.54)}const arrowDir=new THREE.Vector3(Math.cos(aim),0,Math.sin(aim));directionArrow.position.copy(ball.position);directionArrow.position.y=.08;directionArrow.setDirection(arrowDir);directionArrow.setLength(.8+power*1.8,.35,.2);directionArrow.visible=!won&&velocity.length()<.035;ballRing.material.color.setHex(charge?0xffdb50:0xb8ff54);ballRing.scale.setScalar(.9+power*.25);updatePhysics(dt);camera.position.x+=(ball.position.x*0.19-camera.position.x)*dt*2.4;camera.position.z+=(ball.position.z+15-camera.position.z)*dt*2.4;camera.lookAt(new THREE.Vector3(ball.position.x*.18,0,ball.position.z-1.4));renderer.render(scene,camera)};
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();running=false;message.classList.add('error');setMessage('CONTEXT LOST','Restart the runtime to restore the 3D canvas.',true);say('error','NOT READY\nWebGL context was lost. Restart the runtime.')} );loadLevel(0,true);say('ready','READY\nVector Putt 3D is running locally. Use keyboard, PSP touch controls or a gamepad.');animate();
  })();
  </script>
