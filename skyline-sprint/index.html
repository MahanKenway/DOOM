UwBFAEGAOQsNAwAAACAAAAAAAAAAIA==';
    const canvas = document.getElementById('screen');
    const errorBox = document.getElementById('error');
    const ctx = canvas.getContext('2d', { alpha: false });
    ctx.imageSmoothingEnabled = false;
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';

    const memory = new WebAssembly.Memory({ initial: 1, maximum: 1 });
    const pressed = new Set();
    let instance = null;
    let audio = null;

    const postStatus = (state, message) => {
      try { parent.postMessage({ type: 'retroplay-runtime-status', state, message }, location.origin); } catch (_) {}
    };
    const bytes = () => Uint8Array.from(atob(cartBase64), (character) => character.charCodeAt(0));
    const view = () => new DataView(memory.buffer);
    const drawColor = () => {
      const slot = view().getUint16(0x14, true) & 0x000f;
      if (slot === 0) return 'rgba(0,0,0,0)';
      const packed = view().getUint32(0x04 + (slot - 1) * 4, true);
      return '#' + (packed & 0xffffff).toString(16).padStart(6, '0');
    };
    const readUtf16 = (pointer, byteLength) => {
      const words = new Uint16Array(memory.buffer, pointer, Math.floor(byteLength / 2));
      let output = '';
      for (let i = 0; i < words.length; i += 4096) output += String.fromCharCode(...words.subarray(i, i + 4096));
      return output;
    };
    const tone = (frequency, duration, volume, flags) => {
      try {
        if (!audio || audio.state !== 'running') return;
        const oscillator = audio.createOscillator();
        const gain = audio.createGain();
        const start = audio.currentTime;
        const low = frequency & 0xffff;
        const high = frequency >>> 16;
        oscillator.type = (flags & 3) === 2 ? 'triangle' : ((flags & 3) === 3 ? 'sawtooth' : 'square');
        oscillator.frequency.setValueAtTime(Math.max(40, low || high || 220), start);
        if (high) oscillator.frequency.exponentialRampToValueAtTime(Math.max(40, high), start + Math.max(0.01, duration / 1000));
        gain.gain.setValueAtTime(Math.min(0.12, Math.max(0.01, volume / 1000)), start);
        gain.gain.exponentialRampToValueAtTime(0.001, start + Math.max(0.02, duration / 1000));
        oscillator.connect(gain).connect(audio.destination);
        oscillator.start(start);
        oscillator.stop(start + Math.max(0.03, duration / 1000));
      } catch (_) {}
    };
    const host = {
      memory,
      rect(x, y, width, height) { ctx.fillStyle = drawColor(); ctx.fillRect(x, y, width, height); },
      vline(x, y, length) { ctx.fillStyle = drawColor(); ctx.fillRect(x, y, 1, length); },
      oval(x, y, width, height) { ctx.fillStyle = drawColor(); ctx.beginPath(); ctx.ellipse(x + width / 2, y + height / 2, Math.max(.5, width / 2), Math.max(.5, height / 2), 0, 0, Math.PI * 2); ctx.fill(); },
      textUtf16(pointer, byteLength, x, y) { ctx.fillStyle = drawColor(); ctx.font = '8px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'; ctx.fillText(readUtf16(pointer, byteLength), x, y); },
      tone,
    };
    const keyBit = (event) => ({ ArrowLeft: 16, ArrowRight: 32, ArrowUp: 64, ArrowDown: 128, KeyZ: 1, Space: 1, Enter: 1, KeyX: 2 })[event.code] || 0;
    const syncGamepad = () => {
      let state = 0;
      for (const value of pressed) state |= value;
      new Uint8Array(memory.buffer)[0x16] = state;
    };
    const resumeAudio = () => {
      try { if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (_) {}
    };
    const onKeyDown = (event) => { const bit = keyBit(event); if (!bit) return; event.preventDefault(); pressed.add(bit); syncGamepad(); resumeAudio(); };
    const onKeyUp = (event) => { const bit = keyBit(event); if (!bit) return; event.preventDefault(); pressed.delete(bit); syncGamepad(); };
    addEventListener('keydown', onKeyDown, { passive: false });
    addEventListener('keyup', onKeyUp, { passive: false });
    addEventListener('blur', () => { pressed.clear(); syncGamepad(); });
    canvas.addEventListener('pointerdown', () => { canvas.focus(); resumeAudio(); });

    const fail = (error) => {
      console.error(error);
      canvas.style.display = 'none';
      errorBox.style.display = 'block';
      errorBox.textContent = title + ' could not start.\n\n' + (error && error.message ? error.message : String(error));
      postStatus('error', 'Runtime initialization failed');
    };
    const frame = () => {
      try {
        ctx.fillStyle = '#07162b';
        ctx.fillRect(0, 0, 160, 160);
        instance.exports.update();
        requestAnimationFrame(frame);
      } catch (error) { fail(error); }
    };
    postStatus('loading', 'Loading original WASM-4 cartridge');
    WebAssembly.instantiate(bytes(), { env: host })
      .then((result) => {
        instance = result.instance;
        canvas.focus();
        postStatus('ready', title + ' ready');
        frame();
      })
      .catch(fail);
  })();
